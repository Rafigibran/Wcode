name: Temporary Wcode Ad Build

on:
  push:
    branches:
      - wcode/wizardnative-android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install -g cordova
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          npm run setup

      - name: Build
        run: |
          node utils/storage_manager.mjs y
          npm run build paid dev apk

      - name: Verify APK
        run: |
          APK="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wcode-ad-interstitial-test-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
